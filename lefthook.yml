pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,js,mjs,svelte,json,jsonc,md,css,yaml,yml}"
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" bunx prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{ts,js,svelte}"
      exclude: ["pipeline/dist/**"]
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" bunx eslint --fix {staged_files}
      stage_fixed: true
    - name: dotnet-format
      glob: "*.cs"
      run: dotnet format mod/ArdenfallCompendium.csproj --include {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
    - name: plans docs
      glob: "docs/plans/**/*.md"
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" sh -c 'omp-plans index && omp-plans check'
      stage_fixed: true
      skip:
        - run: "! command -v omp-plans"

commit-msg:
  jobs:
    - name: commitlint
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" bun run typecheck
    - name: tests
      run: PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" bun test --pass-with-no-tests
