# Hooks also run from GUI clients, agents and other non-login shells that do not
# have the dev shell on PATH, so every job that needs a pinned tool runs through
# `scripts/hook.sh`, which enters the dev shell and finds nix even when the
# caller's PATH lacks it. That costs about a second per job against a warm store.
#
# Do not hardcode machine paths here. These jobs used to prepend
# "$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin", which is empty on a Nix
# workstation, so both the Bun jobs and the unprefixed `dotnet format` job failed
# on a fresh machine. flake.nix is the one place that names a tool version.
pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,js,mjs,svelte,json,jsonc,md,css,yaml,yml}"
      run: scripts/hook.sh bunx prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{ts,js,svelte}"
      exclude: ["pipeline/dist/**"]
      run: scripts/hook.sh bunx eslint --fix {staged_files}
      stage_fixed: true
    - name: dotnet-format
      glob: "*.cs"
      run: scripts/hook.sh dotnet format mod/ArdenfallCompendium.csproj --include {staged_files}
      stage_fixed: true
      skip:
        - merge
        - rebase
commit-msg:
  jobs:
    - name: commitlint
      run: scripts/hook.sh bunx commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: scripts/hook.sh bun run typecheck
    - name: tests
      run: scripts/hook.sh bun test --pass-with-no-tests
