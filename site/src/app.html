<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <meta name="theme-color" content="#010309" />
    %sveltekit.head%
  </head>
  <!-- Pages are prerendered and +layout.ts disables CSR. Every link is a document load,
       also from the few hydrated routes, so no page fetches another page's data file and
       the build ships none for the static pages. Preloading on hover would fetch data the
       browser then throws away. -->
  <body
    data-sveltekit-preload-data="off"
    data-sveltekit-reload
    class="bg-background text-foreground antialiased"
  >
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
