name = "ardenfall-compendium-site"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-05-07"
# Required because adapter-cloudflare still emits a Worker bundle that imports
# Node builtins through SvelteKit's server environment chunk for fallback routes.
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[[routes]]
pattern = "ardenfall.compendiums.org"
custom_domain = true

# adapter-cloudflare emits both the Worker entry and static asset bundle into
# .svelte-kit/cloudflare. Leave run_worker_first unset so Cloudflare serves
# matching prerendered HTML and WebP assets without invoking the Worker. The
# build-time SQLite database stays in site/.data and is never served. Routes
# should opt out of prerendering only when they genuinely need request-time
# computation.
[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
# Every content route prerenders, and the build database is never deployed, so the Worker cannot
# render a page it has no data for. Without this, an unmatched path such as a stale link or a
# crawler guess reaches the Worker and returns 500 instead of 404. This makes Cloudflare serve the
# prerendered 404 asset directly.
not_found_handling = "404-page"
