name = "ardenfall-compendium-site"
compatibility_date = "2026-05-07"

workers_dev = false

[[routes]]
pattern = "ardenfall.compendiums.org"
custom_domain = true

# The site is files only. Every route prerenders, and the build database lives in site/.data and is
# never deployed, so nothing can be rendered at request time. There is therefore no `main` and no
# Worker: Cloudflare serves these assets directly.
#
# A Worker used to sit here and could only fail. Its bundle pulled in the server modules that read
# the build database, so it threw on load and answered 500 for any address that matched no file,
# instead of 404. `not_found_handling` now serves the prerendered 404.html for a miss.
[assets]
directory = ".svelte-kit/cloudflare"
not_found_handling = "404-page"
