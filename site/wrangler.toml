name = "ardenfall-compendium-site"
main = ".svelte-kit/cloudflare/_worker.js"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat"]

workers_dev = false

[[routes]]
pattern = "ardenfall.compendiums.org"
custom_domain = true

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"
