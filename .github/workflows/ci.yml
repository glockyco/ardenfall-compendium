name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      pipeline: ${{ steps.filter.outputs.pipeline }}
      mod: ${{ steps.filter.outputs.mod }}
      fixtures: ${{ steps.filter.outputs.fixtures }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            pipeline:
              - 'pipeline/**'
              - 'entities/**'
              - 'schemas/**'
              - 'controller/**'
            mod:
              - 'mod/**'
              - 'mod-tests/**'
            fixtures:
              - 'fixtures/**'
              - 'pipeline/scripts/check-fixtures.ts'

            site:
              - 'site/**'
              - 'tooling.test.ts'
              - 'artifact-staging.test.ts'
              - '.github/workflows/ci.yml'
              - 'package.json'
              - 'bun.lock'
              - 'fixtures/**'
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun test tooling.test.ts artifact-staging.test.ts
      - run: bun run check:fixtures
        env: { CI: "true" }
      - run: git diff --check

  pipeline:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.pipeline == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run check:validators
      - run: bun run check:entity-fields
      - run: bun run typecheck
      - run: bun test pipeline/test
      - run: bun test controller/test

  site:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.pipeline == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.fixtures == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run check:validators
      - run: bun run check:entity-fields
      - name: build synthetic fixture artifact for static prerender
        run: bun run artifact:fixture synthetic fixtures/synthetic/snapshot
      - run: bun run --cwd site check
      # Two suites read the built output: item-icon.test.ts opens the prerendered
      # item overview page, and sitemap.test.ts compares the sitemap against the
      # pages actually built. They must run after the build, not before it.
      - run: bun run --cwd site build:fixture
      - run: bun test site/test
      - run: bun run --cwd site smoke:prerender
      - run: bun run --cwd site smoke:pagefind
      - run: bun run --cwd site smoke:map
      - run: bun run --cwd site smoke:accessibility
      - run: bun run --cwd site smoke:error-route
      - run: bun run --cwd site smoke:item-icons

  mod:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.mod == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: format-check
        run: dotnet format mod/ArdenfallCompendium.csproj --verify-no-changes
      # The mod compiles against Assembly-CSharp.dll and the game's Unity, Odin and
      # FlowCanvas assemblies. Those ship with the game, are not redistributable, and
      # so cannot be committed or fetched here; mod/libs/ is gitignored for that
      # reason. Building or testing the mod on a runner is therefore impossible, not
      # merely unconfigured, and a step that tries fails on every push.
      #
      # `dotnet test mod-tests/ArdenfallCompendium.Tests.csproj --nologo -v q` is a
      # required local gate before yielding mod changes, and AGENTS.md says so.
      # Formatting is all a runner can honestly verify.

  fixtures:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.fixtures == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run check:validators
      - run: bun run check:entity-fields
      - run: bun run check:fixtures
        env: { CI: "true" }
